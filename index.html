        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">
          <defs>
            <radialGradient id="shalo1" cx="25%" cy="20%" r="65%">
              <stop offset="0%" stop-color="#3DE07E" stop-opacity="0.32"/>
              <stop offset="60%" stop-color="#3DE07E" stop-opacity="0.0"/>
            </radialGradient>
            <radialGradient id="shalo2" cx="80%" cy="80%" r="60%">
              <stop offset="0%" stop-color="#3DE07E" stop-opacity="0.14"/>
              <stop offset="60%" stop-color="#3DE07E" stop-opacity="0.0"/>
            </radialGradient>
          </defs>

          <rect width="${width}" height="${height}" fill="#0B100E"/>
          <rect width="${width}" height="${height}" fill="url(#shalo1)"/>
          <rect width="${width}" height="${height}" fill="url(#shalo2)"/>

          <!-- FILIGRANE RUGBY -->
          <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="3" fill="none">
            <rect x="70" y="80" width="${width - 140}" height="${height - 160}" rx="12"/>
            <line x1="70" y1="${height / 2}" x2="${width - 70}" y2="${height / 2}"/>
            <circle cx="${width / 2}" cy="${height / 2}" r="200"/>
          </g>

          <!-- EN-TÊTE -->
          <text x="80" y="140" fill="#87948E" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="3">
            ${escapeHtml(seasonLabel)} · ${escapeHtml(clubName)}
          </text>

          <!-- JOUEUR -->
          <text x="80" y="215" fill="#F1F5F2" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900">
            ${escapeHtml(playerName)}
          </text>
          <text x="80" y="260" fill="#3DE07E" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="2">
            ${escapeHtml(postCat)}
          </text>

          <!-- STAT HÉROS DE SAISON -->
          <g transform="translate(${width / 2}, ${height * 0.52})">
            <text x="0" y="60" fill="#F1F5F2" font-family="Arial Narrow, Roboto Condensed, sans-serif" font-size="280" font-weight="900" text-anchor="middle" letter-spacing="-8">
              ${hero.val}
            </text>
            <text x="0" y="145" fill="#3DE07E" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="4" text-anchor="middle">
              ${hero.eyebrow}
            </text>
            <text x="0" y="190" fill="#87948E" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
              ${hero.val > 0 ? `${summary.triesPer80.toFixed(2)} par 80 min` : ''}
            </text>
          </g>

          <!-- FILET -->
          <line x1="80" y1="${height - 240}" x2="${width - 80}" y2="${height - 240}" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

          <!-- 3 MINI-STATS -->
          <g transform="translate(0, ${height - 180})">
            <text x="140" y="0" fill="#5F6B66" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">MATCHS</text>
            <text x="140" y="44" fill="#F1F5F2" font-family="Arial Narrow, Roboto Condensed, sans-serif" font-size="46" font-weight="800" text-anchor="middle">${summary.count}</text>

            <text x="${width / 2}" y="0" fill="#5F6B66" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">POINTS</text>
            <text x="${width / 2}" y="44" fill="#3DE07E" font-family="Arial Narrow, Roboto Condensed, sans-serif" font-size="46" font-weight="800" text-anchor="middle">${summary.points}</text>

            <text x="${width - 140}" y="0" fill="#5F6B66" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">MINUTES</text>
            <text x="${width - 140}" y="44" fill="#F1F5F2" font-family="Arial Narrow, Roboto Condensed, sans-serif" font-size="46" font-weight="800" text-anchor="middle">${summary.minutes}'</text>
          </g>

          <!-- PIED BRANDING -->
          <g transform="translate(0, ${height - 60})">
            <circle cx="88" cy="-6" r="6" fill="#3DE07E"/>
            <text x="108" y="0" fill="#F1F5F2" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="3">OVALIE</text>
            <text x="${width - 80}" y="0" fill="#5F6B66" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="2" text-anchor="end">OVALIE.APP</text>
          </g>
        </svg>
      `;
    }

    /* ============================================================
     * INITIALISATION GLOBALE
     * ============================================================ */
    window.addEventListener('DOMContentLoaded', () => {
      state.db = loadDB();

      // Navigation tab-bar clicks
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', () => {
          const tabKey = tab.getAttribute('data-tab');
          navigateTo(tabKey);
        });
      });

      // Bouton central + pour ajouter un match
      const quickAddBtn = document.getElementById('btn-quick-add-match');
      if (quickAddBtn) {
        quickAddBtn.addEventListener('click', () => {
          state.editingMatchId = null;
          navigateTo('match_form');
        });
      }

      // Si l'utilisateur est déjà connecté, ouvrir directement le dashboard
      if (getCurrentUser()) {
        state.currentView = 'dashboard';
      } else {
        state.currentView = 'auth';
      }

      renderApp();
    });
  </script>
</body>
</html>
